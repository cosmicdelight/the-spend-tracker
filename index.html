<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendTracker</title>
    <meta name="description" content="Track your spending and manage credit cards">
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />

    <!-- og:image is relative so it can never 404. Most scrapers resolve it,
         but some require an absolute URL — swap both image tags to
         https://<your-domain>/pwa-icon-512.png once the domain is final. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SpendTracker">
    <meta property="og:description" content="Track your spending and manage credit cards">
    <meta property="og:image" content="/pwa-icon-512.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpendTracker">
    <meta name="twitter:description" content="Track your spending and manage credit cards">
    <meta name="twitter:image" content="/pwa-icon-512.png">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
